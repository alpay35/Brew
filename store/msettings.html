<head>
<meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-16">
<title>PS4 NAS Store - Ayarlar</title>
<link rel="shortcut icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.input {
    width: 280px;
    padding: 8px;
    font-size: 18px;
    border: 1px solid #555;
    background: #222;
    color: #fff;
    border-radius: 4px;
}
.button {
    background: #0070d1;
    color: #fff;
    border: none;
    padding: 12px 24px;
    font-size: 20px;
    border-radius: 6px;
    cursor: pointer;
}
.button:hover {
    background: #0056a3;
}
form {
    display: table;
    margin: 0 auto;
}
p {
    display: table-row;
}
label {
    display: table-cell;
    padding: 12px 16px;
    text-align: right;
    font-size: 20px;
}
input {
    display: table-cell;
}
</style>
<script>
function setCookie(cname,cvalue,exdays) {
    var d = new Date();
    d.setTime(d.getTime() + (exdays*24*60*60*1000));
    var expires = "expires=" + d.toGMTString();
    document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
}

function getCookie(cname) {
    var name = cname + "=";
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(';');
    for(var i = 0; i < ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') {
            c = c.substring(1);
        }
        if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
        }
    }
    return "";
}

function initSettings() {
    var background = getCookie("background");
    if (background != "") {
        document.body.style.backgroundImage = "url(" + background + ")";	   
    } else {
        document.body.style.backgroundImage = "url('background.png')";
    }
    
    var nasIp = getCookie("NAS_IP") || "192.168.1.50";
    var nasPort = getCookie("NAS_PORT") || "8080";
    var ps4Ip = getCookie("PS4IP") || "127.0.0.1";
    var customPkglink = getCookie("CUSTOM_PKGLINK");

    document.getElementById("nas-ip-input").value = nasIp;
    document.getElementById("nas-port-input").value = nasPort;
    document.getElementById("PS4IP-input").value = ps4Ip;
    document.getElementById("pkglink-input").value = customPkglink;
}

function save() {
    var nasIp = document.getElementById("nas-ip-input").value.trim() || "192.168.1.50";
    var nasPort = document.getElementById("nas-port-input").value.trim() || "8080";
    var ps4Ip = document.getElementById("PS4IP-input").value.trim() || "127.0.0.1";
    var customPkglink = document.getElementById("pkglink-input").value.trim();

    setCookie("NAS_IP", nasIp, 365);
    setCookie("NAS_PORT", nasPort, 365);
    setCookie("PS4IP", ps4Ip, 365);

    var finalPkglink = customPkglink ? customPkglink : ("http://" + nasIp + ":" + nasPort + "/pkgs.json");
    if (!finalPkglink.startsWith("http://") && !finalPkglink.startsWith("https://")) {
        finalPkglink = "http://" + finalPkglink;
    }
    setCookie("CUSTOM_PKGLINK", customPkglink ? finalPkglink : "", 365);
    setCookie("pkglink", finalPkglink, 365);

    alert("Ayarlar kaydedildi! Oyun listesi güncelleniyor...");
    window.location.href = "index.html";
}
</script>
</head>
<body onload="initSettings()">
<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a href="index.html">Oyunlar (Games)</a>
  <a href="settings.html">Ayarlar (Settings)</a>
  <a href="help.html">Yardım (Help)</a>
</div>
<div class="main">
<span class="nav_button" onclick="openNav()"><img src="button.png"></span>
<center>
<font size="12" class="nohover">PS4 NAS Store Ayarları</font>
</center>
<br/><br/>
<form onsubmit="save(); return false;">
  <p>
    <label for="nas-ip-input"><b>NAS IP Adresi:</b></label>
    <input class="input" type="text" id="nas-ip-input" placeholder="192.168.1.50">
  </p>
  <p>
    <label for="nas-port-input"><b>NAS Port:</b></label>
    <input class="input" type="text" id="nas-port-input" placeholder="8080">
  </p>
  <p>
    <label for="PS4IP-input"><b>PS4 IP (Varsayılan 127.0.0.1):</b></label>
    <input class="input" type="text" id="PS4IP-input" placeholder="127.0.0.1">
  </p>
  <p>
    <label for="pkglink-input"><b>Özel JSON Linki (Opsiyonel):</b></label>
    <input class="input" type="text" id="pkglink-input" placeholder="http://192.168.1.50:8080/pkgs.json">
  </p>
  <p>
    <label></label>
    <button class="button" type="button" onclick="save()" id="save-button" style="margin-top:15px;">Ayarları Kaydet (Save)</button>
  </p>
</form>
</div>
<script>
function openNav() {
    document.getElementById("mySidenav").style.width = "250px";
}
function closeNav() {
    document.getElementById("mySidenav").style.width = "0";
}
</script>
